name: Publikacja aplikacji na GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v6

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Spakuj statyczną aplikację
        uses: actions/upload-pages-artifact@v4
        with:
          path: app

      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
